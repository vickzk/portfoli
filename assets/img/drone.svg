<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Line illustration of a quadcopter localizing itself against satellite map features without GPS">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0284c7" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#f8fafc"/>
  <rect width="800" height="600" fill="url(#g)"/>

  <!-- satellite-map abstraction: roads, field parcels, river -->
  <g fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round">
    <path d="M-10 470 C 160 420, 260 520, 420 450 S 700 380, 810 420" stroke-width="10" stroke="#dbeafe"/>
    <path d="M60 -10 L140 610"/>
    <path d="M-10 160 L810 120"/>
    <path d="M520 -10 C 560 200, 600 380, 690 610"/>
    <path d="M-10 330 L300 300 L330 610"/>
    <rect x="600" y="180" width="120" height="90" rx="2"/>
    <rect x="180" y="190" width="90" height="70" rx="2"/>
    <rect x="610" y="470" width="110" height="80" rx="2"/>
    <rect x="40" y="380" width="80" height="60" rx="2"/>
  </g>

  <!-- matched satellite features -->
  <g fill="#0891b2">
    <circle cx="140" cy="148" r="5"/><circle cx="225" cy="225" r="5"/><circle cx="660" cy="225" r="5"/>
    <circle cx="560" cy="300" r="5"/><circle cx="300" cy="303" r="5"/><circle cx="665" cy="510" r="5"/>
    <circle cx="420" cy="450" r="5"/><circle cx="80" cy="410" r="5"/>
  </g>
  <g fill="none" stroke="#0891b2" stroke-width="1.25" stroke-dasharray="4 5" opacity=".75">
    <path d="M400 300 L140 148"/><path d="M400 300 L225 225"/><path d="M400 300 L660 225"/>
    <path d="M400 300 L560 300"/><path d="M400 300 L300 303"/><path d="M400 300 L665 510"/>
    <path d="M400 300 L420 450"/><path d="M400 300 L80 410"/>
  </g>

  <circle cx="400" cy="300" r="230" fill="url(#glow)"/>

  <!-- quadcopter, top view -->
  <g stroke="#0f172a" stroke-width="2.5" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <g stroke-width="10" stroke="#0f172a">
      <path d="M400 300 L290 190"/><path d="M400 300 L510 190"/><path d="M400 300 L290 410"/><path d="M400 300 L510 410"/>
    </g>
    <g fill="#ffffff" fill-opacity=".7" stroke="#0284c7" stroke-width="1.5">
      <circle cx="290" cy="190" r="72"/><circle cx="510" cy="190" r="72"/>
      <circle cx="290" cy="410" r="72"/><circle cx="510" cy="410" r="72"/>
    </g>
    <g stroke="#0284c7" stroke-width="1" fill="none" stroke-dasharray="2 6">
      <circle cx="290" cy="190" r="58"/><circle cx="510" cy="190" r="58"/>
      <circle cx="290" cy="410" r="58"/><circle cx="510" cy="410" r="58"/>
    </g>
    <g stroke-width="5" stroke="#334155">
      <path d="M240 175 L340 205"/><path d="M460 205 L560 175"/><path d="M240 425 L340 395"/><path d="M460 395 L560 425"/>
    </g>
    <g fill="#0f172a" stroke="none">
      <circle cx="290" cy="190" r="12"/><circle cx="510" cy="190" r="12"/><circle cx="290" cy="410" r="12"/><circle cx="510" cy="410" r="12"/>
    </g>
    <rect x="345" y="250" width="110" height="100" rx="18"/>
    <rect x="365" y="268" width="70" height="40" rx="6" fill="#f1f5f9" stroke-width="1.5"/>
    <circle cx="400" cy="328" r="11" fill="#0f172a" stroke="none"/>
    <circle cx="400" cy="328" r="4.5" fill="#0284c7" stroke="none"/>
    <circle cx="372" cy="262" r="3" fill="#0891b2" stroke="none"/>
    <circle cx="428" cy="262" r="3" fill="#0891b2" stroke="none"/>
  </g>

  <!-- telemetry labels -->
  <g font-family="Space Grotesk, ui-monospace, monospace" font-size="13" font-weight="600" letter-spacing=".08em">
    <rect x="24" y="24" width="168" height="30" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="42" cy="39" r="4" fill="#ba1a1a"/>
    <text x="54" y="44" fill="#0f172a">GNSS: DENIED</text>
    <rect x="608" y="24" width="168" height="30" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
    <circle cx="626" cy="39" r="4" fill="#0284c7"/>
    <text x="638" y="44" fill="#0284c7">VIO + SAT-MATCH</text>
    <text x="24" y="580" fill="#64748b">GEO-POSITION ESTIMATE // EDGE INFERENCE</text>
  </g>

  <!-- calibration crosshairs -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <path d="M760 560 h24 M772 548 v24"/><path d="M16 80 h24 M28 68 v24"/>
  </g>
</svg>
